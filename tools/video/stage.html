<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pulso UPCH · escenario del video</title>
<!-- Recording stage for tools/video/record_demo.py: 1920x1080, phone frame with the demo in an
     iframe on the left, large captions on the right. Not part of the public site. -->
<style>
  :root { --brand:#B03437; --gold:#F3C72D; --fg:#1d1d1f; --muted:#5a5a5f; --bg:#f5f5f7; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:absolute; inset:0;
    background: radial-gradient(1200px 800px at 85% 10%, rgba(176,52,55,.10), transparent 60%),
                radial-gradient(900px 700px at 10% 100%, rgba(243,199,45,.12), transparent 60%); }
  .top { position:absolute; top:44px; left:120px; font-size:22px; font-weight:600; color:var(--muted); letter-spacing:-.01em; }
  .top b { color:var(--brand); font-weight:700; }
  .top i { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--gold); margin:0 14px 3px; font-style:normal; }
  .phone { position:absolute; left:220px; top:94px; width:422px; height:892px; border-radius:58px; background:#111;
    padding:16px; box-shadow: 0 40px 80px rgba(0,0,0,.18); }
  .phone iframe { width:390px; height:860px; border:0; border-radius:44px; background:#fff; display:block; }
  .cap { position:absolute; left:820px; top:0; bottom:0; width:940px; display:flex; flex-direction:column; justify-content:center; }
  .step { font-size:24px; font-weight:600; color:var(--brand); margin-bottom:22px; display:flex; align-items:center; }
  .step::before { content:""; width:12px; height:12px; border-radius:50%; background:var(--gold); margin-right:14px; }
  .title { font-size:84px; line-height:1.04; font-weight:700; letter-spacing:-.04em; }
  .line { font-size:36px; line-height:1.3; color:var(--muted); margin-top:28px; letter-spacing:-.015em; max-width:900px; }
  .cap > * { transition: opacity .5s cubic-bezier(.2,.7,.2,1), transform .5s cubic-bezier(.2,.7,.2,1); }
  .cap.out > * { opacity:0; transform: translateY(14px); }
  .foot { position:absolute; right:120px; bottom:44px; font-size:20px; color:var(--muted); }
</style>
</head>
<body>
  <div class="top"><b>Pulso UPCH</b><i></i>Hackathon FACI 2026</div>
  <div class="phone"><iframe id="app" title="Demo de Pulso UPCH"></iframe></div>
  <div class="cap" id="cap"><div class="step" id="step"></div><div class="title" id="title"></div><div class="line" id="line"></div></div>
  <div class="foot" id="foot">Prototipo · viabilidad técnica, no validez clínica</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('app').src = q.get('src') || '../../demo/';
  // Called by the recorder: setCap('Paso 2', 'Inventario SISCO', 'Una línea').
  window.setCap = (step, title, line) => new Promise(res => {
    const c = document.getElementById('cap');
    c.classList.add('out');
    setTimeout(() => {
      document.getElementById('step').textContent = step || '';
      document.getElementById('title').textContent = title || '';
      document.getElementById('line').textContent = line || '';
      c.classList.remove('out'); res();
    }, 500);
  });
</script>
</body>
</html>
